[package]
name = "ilovelawyer-desktop"
version = "0.0.1"
description = "I Love Lawyer desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ilovelawyer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }
dotenvy = "0.15"

# Window Intelligence (src/window_intel.rs). Same major version tauri/tao already pull in, so this
# adds features to one compiled crate rather than a second copy of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
