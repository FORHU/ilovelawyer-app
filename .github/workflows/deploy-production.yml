name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: main

concurrency:
  group: ilovelawyer-app-deploy-production
  cancel-in-progress: true

env:
  ECR_REPOSITORY: ilovelawyer-app
  AWS_REGION: ap-southeast-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Lint, Build, Push & Deploy (production)
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR auth token
        id: ecr-token
        run: |
          echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      # NEXT_PUBLIC_* values are inlined into the client JS bundle at `next build` time,
      # not read at container runtime — see docs/adr/0005-web-env-vars-baked-at-build-time.md.
      # This file must exist before `docker build` runs, since the builder stage's
      # `COPY . .` is what carries it into the image.
      - name: Write web env file
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          cat > ${{ github.workspace }}/apps/web/.env.production.local << EOF
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
          EOF

      - name: Build and push Docker image
        run: |
          ECR="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build \
            -t "$ECR:${{ env.IMAGE_TAG }}" \
            -t "$ECR:latest" \
            .
          docker push "$ECR:${{ env.IMAGE_TAG }}"
          docker push "$ECR:latest"

      - name: Copy env file to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "apps/web/.env.production.local"
          target: "/home/ec2-user/ilovelawyer-app/.env.production.local"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DEPLOY_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: ECR_PASSWORD,ECR_REGISTRY,DEPLOY_IMAGE_TAG
          script: |
            set -e
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/ilovelawyer-app:$DEPLOY_IMAGE_TAG"

            docker stop ilovelawyer-app 2>/dev/null || true
            docker rm   ilovelawyer-app 2>/dev/null || true
            docker run -d --name ilovelawyer-app --restart unless-stopped \
              -p 3002:3000 \
              --env-file /home/ec2-user/ilovelawyer-app/.env.production.local \
              "$ECR_REGISTRY/ilovelawyer-app:$DEPLOY_IMAGE_TAG"
            docker image prune -f
