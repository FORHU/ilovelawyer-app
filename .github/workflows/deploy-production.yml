name: Deploy Production (dev host)

# ilovelawyer-app production on the shared host, replacing the SSH deploy to
# i-09ee0651b89dbdca5.
#
# WHAT CHANGES
#   - SSM instead of scp + ssh. No EC2_SSH_KEY, no EC2_HOST, no open port. The
#     EC2_HOST secret is also what broke on 2026-10-14 when that box's address
#     changed on a stop/start.
#   - The runtime env file is assembled on the host from Parameter Store rather
#     than copied, so nothing lands on a runner's disk.
#   - Container `ilovelawyer-app` on 4033, matching Cloudflare: production is the
#     plain name, dev is ilovelawyer-app-dev on 4030.
#   - The "clean up stale env path" step is gone. It existed because an earlier
#     scp created a DIRECTORY where a file was expected; with no scp there is
#     nothing to clean.
#
# WHAT DOES NOT CHANGE
#   - Lint and typecheck still gate the build.
#   - apps/web/.env.staging is still written BEFORE `docker build`, because
#     NEXT_PUBLIC_* is inlined into the client bundle at `next build` and not
#     read at runtime — see docs/adr/0005-web-env-vars-baked-at-build-time.md.
#     The builder stage's `COPY . .` is what carries it into the image.
#   - The same file is also given to the container at runtime, as it is today.
#     The values are already baked in, so this is belt and braces rather than
#     load-bearing; it is kept so behaviour on the new host is identical.
#
# Dispatch only: the existing workflow still deploys on push to main, and two
# workflows racing the same commit to two hosts is how a brand half-migrates.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false

concurrency:
  group: ilovelawyer-prod-app-dev-host
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-0f95a93145ea25e7a
  ECR_REPOSITORY: ilovelawyer-app
  CONTAINER: ilovelawyer-app
  NETWORK: forhu-dev
  HOST_PORT: "4033"
  APP_PORT: "3002"
  NODE_ENV: production
  ENV_PARAM: /forhu-dev/ilovelawyer-prod-app/env
  MERGED_ENV: /opt/forhu-dev/ilovelawyer-prod-app.env

jobs:
  deploy:
    name: Lint, build, push and deploy (ilovelawyer production app)
    # Native arm64 — the host is Graviton. pnpm and next under QEMU look hung
    # and can take hours.
    runs-on: ubuntu-24.04-arm
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Baked into the bundle at build time. An empty value compiles, deploys and
      # then breaks Google sign-in with nothing in any log, so fail here instead.
      - name: Check Google client ID is populated
        env:
          DEV_NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.DEV_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$DEV_NEXT_PUBLIC_GOOGLE_CLIENT_ID" ]; then
            echo "::error::DEV_NEXT_PUBLIC_GOOGLE_CLIENT_ID is empty. Create it as a secret in the 'production' environment."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      # Must exist before docker build — see the header.
      - name: Write web env file
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.DEV_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          umask 077
          cat > "${{ github.workspace }}/apps/web/.env.staging" << EOF
          NODE_ENV=${{ env.NODE_ENV }}
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
          EOF

          # NODE_ENV was interpolated from an unset variable in the old workflow,
          # so this file began with a bare `NODE_ENV=`. Harmless for a Next build,
          # which defaults to production, but it meant the file never said what it
          # claimed to.
          grep -q '^NEXT_PUBLIC_API_URL=.' apps/web/.env.staging || {
            echo "::error::NEXT_PUBLIC_API_URL is empty — the bundle would ship with no API to call."
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      - name: Publish runtime env to Parameter Store
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.DEV_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'NODE_ENV=%s\n' '${{ env.NODE_ENV }}'
            printf 'PORT=%s\n'     '${{ env.APP_PORT }}'
            printf 'NEXT_PUBLIC_API_URL=%s\n'          "$NEXT_PUBLIC_API_URL"
            printf 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=%s\n' "$NEXT_PUBLIC_GOOGLE_CLIENT_ID"
          } > env.tmp

          aws ssm put-parameter \
            --name "${{ env.ENV_PARAM }}" \
            --type SecureString --overwrite \
            --value "file://env.tmp" \
            --region "${{ env.AWS_REGION }}" > /dev/null
          rm -f env.tmp

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            "aws ssm get-parameter --name ${{ env.ENV_PARAM }} --with-decryption --region ${{ env.AWS_REGION }} --query Parameter.Value --output text > ${{ env.MERGED_ENV }}"
            "chmod 600 ${{ env.MERGED_ENV }}"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker container prune -f || true"
            "docker image prune -af || true"
            "docker pull --platform linux/arm64 ${IMAGE}"
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} --env-file ${{ env.MERGED_ENV }} -p 127.0.0.1:${{ env.HOST_PORT }}:${{ env.APP_PORT }} ${IMAGE}"
          )

          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }

      # Against the container on the host, not the public hostname. Until DNS is
      # cut over, app.ilovelawyer.com still answers from the OLD box — a smoke
      # test against it would pass while this deploy was broken.
      - name: Smoke test (host port)
        run: |
          set -uo pipefail
          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "smoke ${{ env.CONTAINER }}" \
            --parameters commands='["for i in $(seq 1 12); do CODE=$(curl -sL -o /dev/null -m 10 -w %{http_code} http://127.0.0.1:'"${{ env.HOST_PORT }}"'/ || echo 000); echo attempt $i: $CODE; [ \"$CODE\" = \"200\" ] && exit 0; sleep 5; done; exit 1"]' \
            --query Command.CommandId --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --region "${{ env.AWS_REGION }}" \
              --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --region "${{ env.AWS_REGION }}" \
            --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::app did not answer on ${{ env.HOST_PORT }}"; exit 1; }
